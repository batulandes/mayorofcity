<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Belediye Başkanı Simülasyonu</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none;
        }
        .stat { font-size: 24px; margin-bottom: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
        #message-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85); color: white; padding: 30px;
            border-radius: 15px; text-align: center; display: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 2px solid #fff;
        }
        #progress-bar {
            width: 100%; height: 20px; background: #333; margin-top: 15px;
            border-radius: 10px; overflow: hidden; position: relative;
        }
        #filler {
            height: 100%; width: 0%; background: linear-gradient(90deg, #ff4b4b, #ffff4b, #4bff4b);
            transition: width 0.1s linear;
        }
        h1 { margin: 0 0 10px 0; color: #4facfe; }
        .controls { font-size: 14px; color: #ccc; margin-top: 20px; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="stat">💰 Bütçe: <span id="budget">5000</span> ₺</div>
    <div class="stat">😊 Memnuniyet: <span id="happiness">%70</span></div>
    <div class="stat">👥 Nüfus: <span id="population">1200</span></div>
    <div class="controls">
        Hareket: W, A, S, D<br>
        Etkileşim: E<br>
        Mini Oyun: SPACE (Zamanında Bas)
    </div>
</div>

<div id="message-box">
    <h1 id="msg-title">YOL ONARIMI</h1>
    <p id="msg-text">Bozuk yol tespit edildi! Onarmak ister misiniz?</p>
    <div id="game-area" style="display:none;">
        <p>Çubuğu YEŞİL alanda durdur!</p>
        <div id="progress-bar"><div id="filler"></div></div>
        <p style="font-size:12px; margin-top:5px;">SPACE tuşuna bas!</p>
    </div>
    <button id="action-btn" style="margin-top:15px; padding:10px 20px; font-size:16px; cursor:pointer;">Evet (₺500)</button>
</div>

<!-- Three.js Kütüphanesi -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- OYUN DEĞİŞKENLERİ ---
    let budget = 5000;
    let happiness = 70;
    let population = 1200;
    let isMiniGameActive = false;
    let miniGameRunning = false;
    let fillDirection = 1;
    let fillWidth = 0;
    let animationId;

    // --- THREE.JS KURULUMU ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Gökyüzü mavisi

    // İzometrik Kamera
    const aspect = window.innerWidth / window.innerHeight;
    const d = 20;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    
    // İzometrik Açı
    camera.position.set(20, 20, 20); 
    camera.lookAt(scene.position);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Işıklar
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- OYUN DÜNYASI ---
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 }); // Çimen yeşili
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Rastgele Binalar
    const buildingGeo = new THREE.BoxGeometry(2, 4, 2);
    const buildingMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
    
    for(let i=0; i<15; i++) {
        const mesh = new THREE.Mesh(buildingGeo, buildingMat);
        mesh.position.x = (Math.random() - 0.5) * 40;
        mesh.position.z = (Math.random() - 0.5) * 40;
        mesh.position.y = 2;
        // Belediye binası alanını boş bırak
        if(Math.abs(mesh.position.x) < 5 && Math.abs(mesh.position.z) < 5) continue;
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }

    // Belediye Binası
    const cityHallGeo = new THREE.BoxGeometry(6, 6, 6);
    const cityHallMat = new THREE.MeshLambertMaterial({ color: 0xffd700 }); // Altın rengi
    const cityHall = new THREE.Mesh(cityHallGeo, cityHallMat);
    cityHall.position.y = 3;
    cityHall.castShadow = true;
    scene.add(cityHall);

    // Oyuncu (Belediye Başkanı)
    const playerGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
    const playerMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); // Mavi takım elbise
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.y = 1;
    player.castShadow = true;
    scene.add(player);

    // Sorunlu Yol Noktası
    const problemGeo = new THREE.CircleGeometry(1.5, 32);
    const problemMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.7 });
    const problemSpot = new THREE.Mesh(problemGeo, problemMat);
    problemSpot.rotation.x = -Math.PI / 2;
    problemSpot.position.set(8, 0.05, 8);
    scene.add(problemSpot);

    // --- KONTROLLER ---
    const keys = { w: false, a: false, s: false, d: false };
    const speed = 0.2;

    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if(keys.hasOwnProperty(key)) keys[key] = true;
        
        if (key === 'e' && !isMiniGameActive && !miniGameRunning) {
            checkInteraction();
        }
        
        if (key === ' ' && miniGameRunning) {
            completeMiniGame();
        }
    });

    document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if(keys.hasOwnProperty(key)) keys[key] = false;
    });

    function checkInteraction() {
        const dist = player.position.distanceTo(problemSpot.position);
        if(dist < 2.5) {
            startMiniGameUI();
        }
    }

    // --- MİNİ OYUN MANTIĞI ---
    const msgBox = document.getElementById('message-box');
    const gameArea = document.getElementById('game-area');
    const actionBtn = document.getElementById('action-btn');
    const filler = document.getElementById('filler');
    const msgTitle = document.getElementById('msg-title');
    const msgText = document.getElementById('msg-text');

    function startMiniGameUI() {
        isMiniGameActive = true;
        msgBox.style.display = 'block';
        gameArea.style.display = 'none';
        actionBtn.style.display = 'inline-block';
        msgTitle.innerText = "BOZUK YOL TESPİT EDİLDİ";
        msgText.innerText = "Bu yolu onarmak maliyetli ama memnuniyeti artırır.";
        actionBtn.innerText = "Onar (₺500)";
        actionBtn.onclick = startMiniGameLogic;
    }

    function startMiniGameLogic() {
        if(budget < 500) {
            alert("Yetersiz bakiye!");
            closeUI();
            return;
        }
        gameArea.style.display = 'block';
        actionBtn.style.display = 'none';
        miniGameRunning = true;
        fillWidth = 0;
        fillDirection = 1;
        runProgressBar();
    }

    function runProgressBar() {
        if(!miniGameRunning) return;
        fillWidth += 2 * fillDirection;
        if(fillWidth >= 100 || fillWidth <= 0) fillDirection *= -1;
        
        filler.style.width = fillWidth + '%';
        
        // Renk değişimi (Kırmızı -> Sarı -> Yeşil)
        if(fillWidth < 33) filler.style.background = '#ff4b4b';
        else if(fillWidth < 66) filler.style.background = '#ffff4b';
        else filler.style.background = '#4bff4b';

        animationId = requestAnimationFrame(runProgressBar);
    }

    function completeMiniGame() {
        miniGameRunning = false;
        cancelAnimationFrame(animationId);
        
        let success = false;
        if(fillWidth > 60 && fillWidth < 90) success = true; // Yeşil/Sarı bölge

        closeUI();

        if(success) {
            budget -= 500;
            happiness = Math.min(100, happiness + 15);
            population += 50;
            alert("BAŞARILI! Yol onarıldı. (+Memnuniyet)");
            problemSpot.visible = false; // Sorunu kaldır
            // Yeni bir sorun yarat (rastgele)
            setTimeout(() => {
                problemSpot.position.set((Math.random()-0.5)*30, 0.05, (Math.random()-0.5)*30);
                problemSpot.visible = true;
            }, 3000);
        } else {
            budget -= 200;
            happiness = Math.max(0, happiness - 10);
            alert("BAŞARISIZ! Malzeme israf oldu. (-Memnuniyet)");
        }
        updateUI();
    }

    function closeUI() {
        msgBox.style.display = 'none';
        isMiniGameActive = false;
    }

    function updateUI() {
        document.getElementById('budget').innerText = budget;
        document.getElementById('happiness').innerText = '%' + happiness;
        document.getElementById('population').innerText = population;
    }

    // --- OYUN DÖNGÜSÜ ---
    function animate() {
        requestAnimationFrame(animate);

        if(!isMiniGameActive) {
            // Hareket
            if(keys.w) player.position.z -= speed;
            if(keys.s) player.position.z += speed;
            if(keys.a) player.position.x -= speed;
            if(keys.d) player.position.x += speed;

            // Kamera takibi
            camera.position.x = player.position.x + 20;
            camera.position.z = player.position.z + 20;
            camera.lookAt(player.position);
        }

        renderer.render(scene, camera);
    }

    animate();

    // Pencere boyutu değişirse
    window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
