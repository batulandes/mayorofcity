<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Belediye Başkanı Simülasyonu - Düzeltildi</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10;
        }
        .stat { font-size: 24px; margin-bottom: 10px; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid #444; }
        #message-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); color: white; padding: 30px;
            border-radius: 15px; text-align: center; display: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 2px solid #4facfe; z-index: 20;
            min-width: 300px;
        }
        #progress-bar {
            width: 100%; height: 25px; background: #222; margin-top: 15px;
            border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #555;
        }
        #filler {
            height: 100%; width: 0%; background: #ff4b4b;
            transition: width 0.05s linear;
        }
        h1 { margin: 0 0 15px 0; color: #4facfe; font-size: 22px; }
        .controls { 
            position: absolute; bottom: 20px; left: 20px; 
            font-size: 14px; color: #ddd; background: rgba(0,0,0,0.5); 
            padding: 15px; border-radius: 8px; pointer-events: none;
        }
        button {
            background: #4facfe; color: white; border: none; padding: 10px 20px;
            font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background: #00f2fe; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="stat">💰 Bütçe: <span id="budget">5000</span> ₺</div>
    <div class="stat">😊 Memnuniyet: <span id="happiness">%70</span></div>
    <div class="stat">👥 Nüfus: <span id="population">1200</span></div>
</div>

<div class="controls">
    <strong>Kontroller:</strong><br>
    🚶 Hareket: W, A, S, D<br>
    🤝 Etkileşim: E (Kırmızı alanın yanına gel)<br>
    🔨 Mini Oyun: SPACE (Çubuk yeşildeyken bas)
</div>

<div id="message-box">
    <h1 id="msg-title">YOL ONARIMI</h1>
    <p id="msg-text">Bozuk yol tespit edildi! Onarmak ister misiniz?</p>
    
    <div id="game-area" style="display:none;">
        <p style="margin:5px 0; font-weight:bold;">Durdurmak için SPACE'e bas!</p>
        <div id="progress-bar"><div id="filler"></div></div>
    </div>

    <button id="action-btn">Onar (₺500)</button>
</div>

<!-- Three.js Kütüphanesi (Güvenilir CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- OYUN DEĞİŞKENLERİ ---
    let budget = 5000;
    let happiness = 70;
    let population = 1200;
    let isMiniGameActive = false;
    let miniGameRunning = false;
    let fillDirection = 1;
    let fillWidth = 0;
    let animationId;

    // --- THREE.JS KURULUMU ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Açık Mavi Gökyüzü
    scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Uzakları sislerle yumuşat

    // İzometrik Kamera Ayarları
    const aspect = window.innerWidth / window.innerHeight;
    const d = 30; // Görüş mesafesi
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    
    // Kamera Pozisyonu (İzometrik Açı)
    camera.position.set(30, 30, 30); 
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- IŞIKLAR ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(50, 80, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -50;
    dirLight.shadow.camera.right = 50;
    dirLight.shadow.camera.top = 50;
    dirLight.shadow.camera.bottom = -50;
    scene.add(dirLight);

    // --- ZEMİN ---
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x56ab2f }); // Canlı Çimen
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Izgara (Grid) - Yön bulmayı kolaylaştırır
    const gridHelper = new THREE.GridHelper(100, 20, 0x000000, 0x000000);
    gridHelper.material.opacity = 0.1;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- BİNALAR ---
    const buildingColors = [0xaaaaaa, 0x88ccff, 0xffccaa, 0xccffcc];
    for(let i=0; i<20; i++) {
        const h = Math.random() * 4 + 2;
        const buildingGeo = new THREE.BoxGeometry(3, h, 3);
        const col = buildingColors[Math.floor(Math.random() * buildingColors.length)];
        const buildingMat = new THREE.MeshLambertMaterial({ color: col });
        const mesh = new THREE.Mesh(buildingGeo, buildingMat);
        
        let x = (Math.random() - 0.5) * 80;
        let z = (Math.random() - 0.5) * 80;
        
        // Merkezdeki belediye binası alanını boş bırak
        if(Math.abs(x) < 10 && Math.abs(z) < 10) { x += 15; } 

        mesh.position.set(x, h/2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }

    // --- BELEDİYE BİNASI (MERKEZ) ---
    const cityHallGroup = new THREE.Group();
    const baseGeo = new THREE.BoxGeometry(8, 2, 8);
    const baseMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = 1;
    base.castShadow = true;
    base.receiveShadow = true;
    
    const mainGeo = new THREE.BoxGeometry(6, 6, 6);
    const mainMat = new THREE.MeshLambertMaterial({ color: 0xffd700 }); // Altın
    const mainPart = new THREE.Mesh(mainGeo, mainMat);
    mainPart.position.y = 5;
    mainPart.castShadow = true;
    
    cityHallGroup.add(base);
    cityHallGroup.add(mainPart);
    scene.add(cityHallGroup);

    // --- OYUNCU (BELEDİYE BAŞKANI) ---
    const playerGroup = new THREE.Group();
    
    // Gövde
    const bodyGeo = new THREE.CapsuleGeometry(0.6, 1.2, 4, 8);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); // Mavi Takım Elbise
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    
    // Kafa
    const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffccaa }); // Ten rengi
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.2;
    head.castShadow = true;

    playerGroup.add(body);
    playerGroup.add(head);
    scene.add(playerGroup);

    // --- SORUNLU YOL NOKTASI ---
    const problemGroup = new THREE.Group();
    const holeGeo = new THREE.CircleGeometry(2, 32);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x333333 }); // Asfalt deliği
    const hole = new THREE.Mesh(holeGeo, holeMat);
    hole.rotation.x = -Math.PI / 2;
    hole.position.y = 0.02;
    
    const warningGeo = new THREE.RingGeometry(2.2, 2.5, 32);
    const warningMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
    const warning = new THREE.Mesh(warningGeo, warningMat);
    warning.rotation.x = -Math.PI / 2;
    warning.position.y = 0.05;

    problemGroup.add(hole);
    problemGroup.add(warning);
    scene.add(problemGroup);

    // İlk sorunlu nokta
    spawnProblem();

    function spawnProblem() {
        const x = (Math.random() - 0.5) * 60;
        const z = (Math.random() - 0.5) * 60;
        // Çok uzağa veya merkeze düşmesin
        if(Math.abs(x) < 5 && Math.abs(z) < 5) return spawnProblem();
        
        problemGroup.position.set(x, 0, z);
        problemGroup.visible = true;
    }

    // --- KONTROLLER ---
    const keys = { w: false, a: false, s: false, d: false };
    const speed = 0.3;

    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if(keys.hasOwnProperty(key)) keys[key] = true;
        
        if (key === 'e' && !isMiniGameActive && !miniGameRunning) {
            checkInteraction();
        }
        
        if (key === ' ' && miniGameRunning) {
            completeMiniGame();
        }
    });

    document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if(keys.hasOwnProperty(key)) keys[key] = false;
    });

    function checkInteraction() {
        const dist = playerGroup.position.distanceTo(problemGroup.position);
        if(dist < 4) {
            startMiniGameUI();
        } else {
            // Çok uzaksa uyarı verme, sadece sessizce geç
        }
    }

    // --- UI VE MİNİ OYUN ---
    const msgBox = document.getElementById('message-box');
    const gameArea = document.getElementById('game-area');
    const actionBtn = document.getElementById('action-btn');
    const filler = document.getElementById('filler');
    const msgTitle = document.getElementById('msg-title');
    const msgText = document.getElementById('msg-text');

    function startMiniGameUI() {
        isMiniGameActive = true;
        msgBox.style.display = 'block';
        gameArea.style.display = 'none';
        actionBtn.style.display = 'inline-block';
        msgTitle.innerText = "BOZUK YOL TESPİT EDİLDİ";
        msgTitle.style.color = "#ff4b4b";
        msgText.innerText = "Vatandaşlar şikayetçi! Bu yolu onarmak bütçeyi sarsar ama memnuniyeti artırır.";
        actionBtn.innerText = "Onar (₺500)";
        actionBtn.onclick = startMiniGameLogic;
    }

    function startMiniGameLogic() {
        if(budget < 500) {
            alert("Yetersiz bakiye! En az 500 TL lazım.");
            closeUI();
            return;
        }
        gameArea.style.display = 'block';
        actionBtn.style.display = 'none';
        miniGameRunning = true;
        fillWidth = 0;
        fillDirection = 1; // Sağa doğru başla
        runProgressBar();
    }

    function runProgressBar() {
        if(!miniGameRunning) return;
        
        // Hızlandırma efekti
        let currentSpeed = 2 + (fillWidth / 20); 
        fillWidth += currentSpeed * fillDirection;
        
        if(fillWidth >= 100) { fillWidth = 100; fillDirection = -1; }
        if(fillWidth <= 0) { fillWidth = 0; fillDirection = 1; }
        
        filler.style.width = fillWidth + '%';
        
        // Renk Mantığı
        if(fillWidth < 40) filler.style.background = '#ff4b4b'; // Kırmızı
        else if(fillWidth < 70) filler.style.background = '#ffff4b'; // Sarı
        else filler.style.background = '#4bff4b'; // Yeşil (Hedef)

        animationId = requestAnimationFrame(runProgressBar);
    }

    function completeMiniGame() {
        miniGameRunning = false;
        cancelAnimationFrame(animationId);
        
        // Başarı aralığı: %65 ile %95 arası (Yeşil bölge)
        let success = (fillWidth > 65 && fillWidth < 95);

        closeUI();

        if(success) {
            budget -= 500;
            happiness = Math.min(100, happiness + 15);
            population += 50;
            alert("BAŞARILI! Yol mükemmel onarıldı.\n+Memnuniyet\n+Nüfus");
            problemGroup.visible = false; // Sorunu kaldır
            
            // 3 saniye sonra yeni bir sorun yarat
            setTimeout(() => {
                spawnProblem();
            }, 3000);
        } else {
            budget -= 200;
            happiness = Math.max(0, happiness - 10);
            alert("BAŞARISIZ!\nZamanlama hatalı. Malzeme israf oldu.\n-Memnuniyet");
        }
        updateUI();
    }

    function closeUI() {
        msgBox.style.display = 'none';
        isMiniGameActive = false;
    }

    function updateUI() {
        document.getElementById('budget').innerText = budget;
        document.getElementById('happiness').innerText = '%' + happiness;
        document.getElementById('population').innerText = population;
    }

    // --- OYUN DÖNGÜSÜ ---
    function animate() {
        requestAnimationFrame(animate);

        if(!isMiniGameActive) {
            // Hareket Mantığı
            let moved = false;
            if(keys.w) { playerGroup.position.z -= speed; playerGroup.rotation.y = Math.PI; moved = true; }
            if(keys.s) { playerGroup.position.z += speed; playerGroup.rotation.y = 0; moved = true; }
            if(keys.a) { playerGroup.position.x -= speed; playerGroup.rotation.y = -Math.PI/2; moved = true; }
            if(keys.d) { playerGroup.position.x += speed; playerGroup.rotation.y = Math.PI/2; moved = true; }

            // Kamera Takibi (Yumuşak)
            const targetX = playerGroup.position.x + 30;
            const targetZ = playerGroup.position.z + 30;
            camera.position.x += (targetX - camera.position.x) * 0.1;
            camera.position.z += (targetZ - camera.position.z) * 0.1;
            camera.lookAt(playerGroup.position);
            
            // Sınır kontrolü (Harita dışına çıkma)
            playerGroup.position.x = Math.max(-45, Math.min(45, playerGroup.position.x));
            playerGroup.position.z = Math.max(-45, Math.min(45, playerGroup.position.z));
        }

        // Problem alanı animasyonu (Dönme efekti)
        if(problemGroup.visible) {
            problemGroup.children[1].rotation.z -= 0.05;
        }

        renderer.render(scene, camera);
    }

    animate();

    // Pencere boyutu değişirse
    window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
